name: 同步成本、账号和已上传记录
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
  actions: write
jobs:
  sync-and-publish:
    # Hold the shared state/session lock for the entire restore-to-publish transaction.
    concurrency:
      group: pages
      cancel-in-progress: false
    if: startsWith(github.event.issue.title, '[Price Guard Sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 恢复最新加密数据
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            public/data/share-images
          key: price-guard-state-${{ github.run_id }}
          restore-keys: |
            price-guard-state-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 合并网页已发布状态，防止账号和成本被旧缓存覆盖
        run: node scripts/restore-published-state.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - run: npm ci
      - run: npm test
      - name: 按顺序合并全部待处理请求
        id: sync
        run: node scripts/process-sync-queue.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: 保存最新加密数据
        run: node scripts/repack-dashboard.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - name: 准备手机以图搜索图片
        run: npm run prepare:share-images
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      - uses: actions/cache/save@v4
        with:
          path: |
            state
            public/data/share-images
          key: price-guard-state-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact-1
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: 发布网页
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          artifact_id: ${{ steps.pages-artifact-1.outputs.artifact_id }}
      - name: 确认已发布请求并启动新账号扫描
        run: node scripts/ack-sync-queue.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_ACCOUNT_SCAN: '1'
