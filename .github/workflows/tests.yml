name: Regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-geometry.txt
      - name: Install pinned local geometry runtime and run no-source self-check
        timeout-minutes: 3
        run: |
          run_timed() {
            phase="$1"; shift; started=$(date +%s%3N)
            set +e; "$@"; code=$?; set -e
            printf '{"geometryPreparationPhase":"%s","elapsedMs":%s,"exitCode":%s}\n' "$phase" "$(( $(date +%s%3N) - started ))" "$code"
            return "$code"
          }
          run_timed venv python3 -m venv .geometry-venv
          run_timed wheels .geometry-venv/bin/python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r requirements-geometry.txt
          run_timed generated_self_check env PATH="$PWD/.geometry-venv/bin:$PATH" node scripts/check-geometry-runtime.mjs
      - run: npm test

  saved-shared-quote-readback:
    # Exactly one pinned Pages read; no source collection or state mutation.
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'hyx60268-dev/price-guard' &&
      github.head_ref == 'diagnostic/shared-607-counts' &&
      github.event.pull_request.base.ref == 'main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Read pinned published shared quote counts without market requests
        run: |
          export CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          node scripts/read-shared-quote-publication.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          AUDIT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
