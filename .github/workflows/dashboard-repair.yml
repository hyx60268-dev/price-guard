name: 快速发布仪表盘

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/lib/publish.mjs
      - scripts/repack-dashboard.mjs
      - scripts/restore-published-state.mjs
      - .github/workflows/dashboard-repair.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repack-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 恢复完整加密基准
        run: node scripts/restore-published-state.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      - name: 生成手机轻量登录数据
        run: node scripts/repack-dashboard.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-repair-${{ github.run_attempt }}
      - name: 发布登录修复
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-repair-${{ github.run_attempt }}
