# Generated by scripts/generate-cadence-workflow.mjs; manual finite validation only.
name: 有限两小时周期验证
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/cadence-validation.json]
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: price-guard-finite-cadence
  cancel-in-progress: false
jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.anchor.outputs.enabled }}
      epoch: ${{ steps.anchor.outputs.epoch }}
      code_sha: ${{ steps.anchor.outputs.code_sha }}
      priority_item_ids: ${{ steps.anchor.outputs.priority_item_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: anchor
        run: node scripts/scan-admission.mjs anchor
        env:
          GITHUB_TOKEN: ${{ github.token }}
  slot-0:
    if: ${{ !cancelled() && !failure() && needs.anchor.result == 'success' && needs.anchor.outputs.enabled == 'true' }}
    needs: [anchor]
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      cadence_epoch: ${{ needs.anchor.outputs.epoch }}
      cadence_slot: '0'
      cadence_expected_sha: ${{ needs.anchor.outputs.code_sha }}
      priority_item_ids: ${{ needs.anchor.outputs.priority_item_ids }}
  acceptance-0:
    needs: slot-0
    if: ${{ !cancelled() && needs.slot-0.result == 'success' && needs.slot-0.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保留此槽实际产品验收结果
        env:
          COST_EXIT: ${{ needs.slot-0.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.slot-0.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
  slot-1:
    if: ${{ !cancelled() && !failure() && needs.anchor.result == 'success' && needs.anchor.outputs.enabled == 'true' && needs.slot-0.result == 'success' }}
    needs: [anchor, slot-0]
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      cadence_epoch: ${{ needs.anchor.outputs.epoch }}
      cadence_slot: '1'
      cadence_expected_sha: ${{ needs.anchor.outputs.code_sha }}
      cadence_previous_artifact: ${{ needs.slot-0.outputs.state_artifact }}
  acceptance-1:
    needs: slot-1
    if: ${{ !cancelled() && needs.slot-1.result == 'success' && needs.slot-1.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保留此槽实际产品验收结果
        env:
          COST_EXIT: ${{ needs.slot-1.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.slot-1.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
  slot-2:
    if: ${{ !cancelled() && !failure() && needs.anchor.result == 'success' && needs.anchor.outputs.enabled == 'true' && needs.slot-1.result == 'success' }}
    needs: [anchor, slot-1]
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      cadence_epoch: ${{ needs.anchor.outputs.epoch }}
      cadence_slot: '2'
      cadence_expected_sha: ${{ needs.anchor.outputs.code_sha }}
      cadence_previous_artifact: ${{ needs.slot-1.outputs.state_artifact }}
  acceptance-2:
    needs: slot-2
    if: ${{ !cancelled() && needs.slot-2.result == 'success' && needs.slot-2.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保留此槽实际产品验收结果
        env:
          COST_EXIT: ${{ needs.slot-2.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.slot-2.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
  slot-3:
    if: ${{ !cancelled() && !failure() && needs.anchor.result == 'success' && needs.anchor.outputs.enabled == 'true' && needs.slot-2.result == 'success' }}
    needs: [anchor, slot-2]
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      cadence_epoch: ${{ needs.anchor.outputs.epoch }}
      cadence_slot: '3'
      cadence_expected_sha: ${{ needs.anchor.outputs.code_sha }}
      cadence_previous_artifact: ${{ needs.slot-2.outputs.state_artifact }}
  acceptance-3:
    needs: slot-3
    if: ${{ !cancelled() && needs.slot-3.result == 'success' && needs.slot-3.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保留此槽实际产品验收结果
        env:
          COST_EXIT: ${{ needs.slot-3.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.slot-3.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
  slot-4:
    if: ${{ !cancelled() && !failure() && needs.anchor.result == 'success' && needs.anchor.outputs.enabled == 'true' && needs.slot-3.result == 'success' }}
    needs: [anchor, slot-3]
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      cadence_epoch: ${{ needs.anchor.outputs.epoch }}
      cadence_slot: '4'
      cadence_expected_sha: ${{ needs.anchor.outputs.code_sha }}
      cadence_previous_artifact: ${{ needs.slot-3.outputs.state_artifact }}
  acceptance-4:
    needs: slot-4
    if: ${{ !cancelled() && needs.slot-4.result == 'success' && needs.slot-4.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保留此槽实际产品验收结果
        env:
          COST_EXIT: ${{ needs.slot-4.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.slot-4.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
  slot-5:
    if: ${{ !cancelled() && !failure() && needs.anchor.result == 'success' && needs.anchor.outputs.enabled == 'true' && needs.slot-4.result == 'success' }}
    needs: [anchor, slot-4]
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      cadence_epoch: ${{ needs.anchor.outputs.epoch }}
      cadence_slot: '5'
      cadence_expected_sha: ${{ needs.anchor.outputs.code_sha }}
      cadence_previous_artifact: ${{ needs.slot-4.outputs.state_artifact }}
  acceptance-5:
    needs: slot-5
    if: ${{ !cancelled() && needs.slot-5.result == 'success' && needs.slot-5.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保留此槽实际产品验收结果
        env:
          COST_EXIT: ${{ needs.slot-5.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.slot-5.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
  window-acceptance:
    needs: [anchor, slot-0, slot-1, slot-2, slot-3, slot-4, slot-5]
    if: ${{ !cancelled() && needs.anchor.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/report-cadence-window.mjs
        env:
          CADENCE_NEEDS_JSON: ${{ toJSON(needs) }}
