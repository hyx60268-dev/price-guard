name: 每20分钟价格检查
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub 云端约每 20 分钟检查一次；无需电脑或手机保持开机。
    - cron: '*/20 * * * *'
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  # 同时只允许一轮发布。GitHub 仍会替换旧 pending 任务；以 status.json
  # 的 codeSha 和成功的 deployment 为准，不把排队视为已执行。
  cancel-in-progress: false
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 恢复上次加密基准
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            public/data/share-images
          key: price-guard-state-${{ github.run_id }}
          restore-keys: |
            price-guard-state-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 合并网页已发布状态，防止账号和成本被旧缓存覆盖
        run: node scripts/restore-published-state.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - run: npm ci
      - name: 验证比价与成本回归测试
        run: npm test
      - name: 合并等待中的多人同步请求
        id: sync
        run: node scripts/process-sync-queue.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
      # 用户登录文件很小。合并到新用户后先发布一次，不让用户等待后面的全量扫描。
      - name: 配置账号快速发布
        if: steps.sync.outputs.processed != '0'
        uses: actions/configure-pages@v5
      - name: 上传账号快速发布包
        if: steps.sync.outputs.processed != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-users-${{ github.run_attempt }}
      - name: 立即发布新用户和账号
        if: steps.sync.outputs.processed != '0'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-users-${{ github.run_attempt }}
      - run: npx playwright install --with-deps chromium
      - name: 检查 Yahoo 与闲鱼
        run: npm run scan
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XIANYU_AUTH_PART_1: ${{ secrets.XIANYU_AUTH_PART_1 }}
          XIANYU_AUTH_PART_2: ${{ secrets.XIANYU_AUTH_PART_2 }}
          XIANYU_AUTH_PART_3: ${{ secrets.XIANYU_AUTH_PART_3 }}
          XIANYU_STORAGE_STATE_GZIP_B64: ${{ secrets.XIANYU_STORAGE_STATE_GZIP_B64 }}
          XIANYU_STORAGE_STATE_B64: ${{ secrets.XIANYU_STORAGE_STATE_B64 }}
          SCAN_TRIGGER: ${{ github.event_name }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - name: 更新热卖选品（1小时缓存、分页及卖家轮换）
        run: npm run discovery
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XIANYU_AUTH_PART_1: ${{ secrets.XIANYU_AUTH_PART_1 }}
          XIANYU_AUTH_PART_2: ${{ secrets.XIANYU_AUTH_PART_2 }}
          XIANYU_AUTH_PART_3: ${{ secrets.XIANYU_AUTH_PART_3 }}
          XIANYU_STORAGE_STATE_GZIP_B64: ${{ secrets.XIANYU_STORAGE_STATE_GZIP_B64 }}
          XIANYU_STORAGE_STATE_B64: ${{ secrets.XIANYU_STORAGE_STATE_B64 }}
          SCAN_TRIGGER: ${{ github.event_name }}
      - name: 准备手机以图搜索图片
        run: npm run prepare:share-images
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      - name: 数据变化时发送手机提醒
        run: npm run notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: 新增热卖选品时发送手机提醒
        run: npm run notify:discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: 保存本次加密基准
        run: mkdir -p state && cp public/data/latest.json.enc state/latest.json.enc
      - uses: actions/cache/save@v4
        with:
          path: |
            state
            public/data/share-images
          key: price-guard-state-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
