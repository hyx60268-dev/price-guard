name: 每20分钟价格检查
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub 云端约每 20 分钟检查一次；无需电脑或手机保持开机。
    - cron: '*/20 * * * *'
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 恢复上次加密基准
        uses: actions/cache/restore@v4
        with:
          path: state
          key: price-guard-state-${{ github.run_id }}
          restore-keys: |
            price-guard-state-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 检查 Yahoo 与闲鱼
        run: npm run scan
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XIANYU_AUTH_PART_1: ${{ secrets.XIANYU_AUTH_PART_1 }}
          XIANYU_AUTH_PART_2: ${{ secrets.XIANYU_AUTH_PART_2 }}
          XIANYU_AUTH_PART_3: ${{ secrets.XIANYU_AUTH_PART_3 }}
          XIANYU_STORAGE_STATE_GZIP_B64: ${{ secrets.XIANYU_STORAGE_STATE_GZIP_B64 }}
          XIANYU_STORAGE_STATE_B64: ${{ secrets.XIANYU_STORAGE_STATE_B64 }}
      - name: 数据变化时发送手机提醒
        run: npm run notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: 保存本次加密基准
        run: mkdir -p state && cp public/data/latest.json.enc state/latest.json.enc
      - uses: actions/cache/save@v4
        with:
          path: state
          key: price-guard-state-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
