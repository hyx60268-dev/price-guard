name: 每20分钟价格检查
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_audit:
        description: 全量核验所有账号全部商品（Yahoo与Rakuma）
        type: boolean
        default: false
      priority_item_ids:
        description: 优先复查的已录入商品ID（逗号分隔，最多20个，不跳过核验）
        type: string
        default: ''
  schedule:
    # 每小时第 7、27、47 分钟触发，避开整点高峰；GitHub 仍可能延迟派发。
    - cron: '7,27,47 * * * *'
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
jobs:
  update-health:
    # This independent check must run even when a writer never starts.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 检查已发布数据与阻塞任务
        run: node scripts/check-update-health.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
  scan-and-publish:
    # Hold the shared state/session lock for the entire restore-to-publish transaction.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 恢复上次加密基准
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            public/data/share-images
          key: price-guard-state-${{ github.run_id }}
          restore-keys: |
            price-guard-state-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 合并网页已发布状态，防止账号和成本被旧缓存覆盖
        run: node scripts/restore-published-state.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - run: npm ci
      - name: 验证比价与成本回归测试
        run: npm test
      - name: 合并等待中的多人同步请求
        id: sync
        run: node scripts/process-sync-queue.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
      # 用户登录文件很小。合并到新用户后先发布一次，不让用户等待后面的全量扫描。
      - name: 为新版本恢复完整看板数据
        if: github.event_name == 'push'
        run: node scripts/repack-dashboard.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - name: 配置账号和新版界面快速发布
        if: github.event_name == 'push' || steps.sync.outputs.processed != '0'
        uses: actions/configure-pages@v5
      - name: 上传账号快速发布包
        if: github.event_name == 'push' || steps.sync.outputs.processed != '0'
        uses: actions/upload-pages-artifact@v3
        id: pages-artifact-1
        with:
          path: public
          name: github-pages-users-${{ github.run_attempt }}
      - name: 立即发布新用户和账号
        if: github.event_name == 'push' || steps.sync.outputs.processed != '0'
        uses: ./.github/actions/deploy-pages-retry
        with:
          artifact_id: ${{ steps.pages-artifact-1.outputs.artifact_id }}
      - name: 确认已发布同步请求
        if: steps.sync.outputs.processed != '0'
        run: node scripts/ack-sync-queue.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - name: 并行检查三平台价格与闲鱼成本
        run: npm run scan
        env:
          # Normal pushes and scheduled runs use the bounded rotating scan so a
          # fresh dashboard is published every cycle. Full audit remains an
          # explicit maintenance action; its progress is still accumulated by
          # the same encrypted baseline instead of blocking ordinary updates.
          FULL_PRICE_AUDIT: ${{ inputs.full_audit && '1' || '0' }}
          PRICE_AUDIT_ITEM_IDS: ${{ inputs.priority_item_ids || '' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XIANYU_AUTH_PART_1: ${{ secrets.XIANYU_AUTH_PART_1 }}
          XIANYU_AUTH_PART_2: ${{ secrets.XIANYU_AUTH_PART_2 }}
          XIANYU_AUTH_PART_3: ${{ secrets.XIANYU_AUTH_PART_3 }}
          XIANYU_STORAGE_STATE_GZIP_B64: ${{ secrets.XIANYU_STORAGE_STATE_GZIP_B64 }}
          XIANYU_STORAGE_STATE_B64: ${{ secrets.XIANYU_STORAGE_STATE_B64 }}
          SCAN_TRIGGER: ${{ github.event_name }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - name: 发布本轮价格、库存与成本
        run: node scripts/prepare-publication.mjs
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PORTAL_USERS_JSON: ${{ secrets.PORTAL_USERS_JSON }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact-2
        with:
          path: public
          name: github-pages-prices-${{ github.run_attempt }}
      - uses: ./.github/actions/deploy-pages-retry
        with:
          artifact_id: ${{ steps.pages-artifact-2.outputs.artifact_id }}
      # A due-check here makes daily monitoring survive GitHub replacing a
      # pending standalone publication with a scheduled pricing run.
      - name: 补执行到期的每日商家监控
        run: node scripts/merchant-monitor.mjs
        env:
          MERCHANT_MONITOR_IF_DUE: '1'
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          XIANYU_AUTH_PART_1: ${{ secrets.XIANYU_AUTH_PART_1 }}
          XIANYU_AUTH_PART_2: ${{ secrets.XIANYU_AUTH_PART_2 }}
          XIANYU_AUTH_PART_3: ${{ secrets.XIANYU_AUTH_PART_3 }}
          XIANYU_STORAGE_STATE_GZIP_B64: ${{ secrets.XIANYU_STORAGE_STATE_GZIP_B64 }}
          XIANYU_STORAGE_STATE_B64: ${{ secrets.XIANYU_STORAGE_STATE_B64 }}
      - name: 准备手机以图搜索图片
        run: npm run prepare:share-images
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      - name: 数据变化时发送手机提醒
        run: npm run notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: 保存本次加密基准
        run: test -s state/latest.json.enc
      - uses: actions/cache/save@v4
        with:
          path: |
            state
            public/data/share-images
          key: price-guard-state-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact-3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: 发布网页
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          artifact_id: ${{ steps.pages-artifact-3.outputs.artifact_id }}
      - name: 验收云端闲鱼自动成本（独立于网页发布）
        run: node scripts/check-cloud-cost.mjs
      - name: 验收全账号价格覆盖（全量运行）
        if: ${{ always() && inputs.full_audit }}
        run: node scripts/check-price-coverage.mjs
