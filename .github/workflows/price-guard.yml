name: 每20分钟价格检查
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pricing_engine:
        description: 价格执行器（全量图为有界验证模式，不能代表20分钟验收通过）
        type: choice
        options: [legacy, full_inventory_graph]
        default: legacy
      full_audit:
        description: 旧执行器维护核验（须选择 legacy，不代表20分钟周期）
        type: boolean
        default: false
      priority_item_ids:
        description: legacy 优先复查商品ID（逗号分隔，最多20个，不跳过核验）
        type: string
        default: ''
  schedule:
    # 每小时第 7、27、47 分钟触发，避开整点高峰；GitHub 仍可能延迟派发。
    - cron: '7,27,47 * * * *'
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
jobs:
  update-health:
    # This independent check must run even when a writer never starts.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 检查已发布数据与阻塞任务
        run: node scripts/check-update-health.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
  scan-and-publish:
    uses: ./.github/workflows/price-scan-transaction.yml
    secrets: inherit
    with:
      pricing_engine: ${{ inputs.pricing_engine || 'legacy' }}
      full_audit: ${{ inputs.full_audit || false }}
      priority_item_ids: ${{ inputs.priority_item_ids || '' }}
  acceptance:
    # A red product acceptance stays visible, separate from operational errors.
    # Finite callers report the exact same exits in their sibling acceptance job.
    needs: scan-and-publish
    if: ${{ !cancelled() && needs.scan-and-publish.result == 'success' && needs.scan-and-publish.outputs.admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 保持真实成本与全量周期验收结果
        env:
          COST_EXIT: ${{ needs.scan-and-publish.outputs.cost_exit }}
          COVERAGE_EXIT: ${{ needs.scan-and-publish.outputs.coverage_exit }}
        run: |
          echo "Cost acceptance exit: $COST_EXIT; complete-cycle acceptance exit: $COVERAGE_EXIT"
          test "$COST_EXIT" = 0 && test "$COVERAGE_EXIT" = 0
