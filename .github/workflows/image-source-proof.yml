name: 站外找图离线回归
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/lib/external-images.mjs
      - scripts/lib/search-localization.mjs
      - scripts/prove-image-search.mjs
      - scripts/lib/procurement-proof-access.mjs
      - test/proof-entry-guards.test.mjs
      - .github/workflows/image-source-proof.yml
permissions:
  contents: read
jobs:
  public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This runner has no restored shared search hold and makes no live search.
      - name: 离线搜索解析与冷却回归（不代表真实找图验收）
        run: node --test test/search-access.test.mjs test/search-localization.test.mjs test/proof-entry-guards.test.mjs
