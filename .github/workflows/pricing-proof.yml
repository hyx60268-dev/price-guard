name: 三平台比价离线回归
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/lib/mercari*
      - public/pricing-policy.js
      - scripts/pricing-proof.mjs
      - scripts/lib/procurement-proof-access.mjs
      - test/proof-entry-guards.test.mjs
      - .github/workflows/pricing-proof.yml
permissions:
  contents: read
jobs:
  public-price-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No shared live source state is restored in PR/manual regression jobs.
      # Actual inventory and source coverage remain normal production acceptance.
      - name: 离线匹配与入口安全回归（不代表真实源覆盖）
        run: node --test test/three-platform-pricing.test.mjs test/same-platform-pricing.test.mjs test/proof-entry-guards.test.mjs
