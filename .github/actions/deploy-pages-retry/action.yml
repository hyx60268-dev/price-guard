name: Publish Pages with bounded creation retries
description: Deploy exactly the uploaded artifact; only explicit creation 5xx responses are retried.
inputs:
  artifact_id:
    description: Artifact ID returned by this run's upload-pages-artifact step.
    required: true
outputs:
  page_url:
    description: Confirmed Pages deployment URL.
    value: ${{ steps.publish.outputs.page_url }}
  deployment_id:
    description: Deployment ID returned by the create response.
    value: ${{ steps.publish.outputs.deployment_id }}
runs:
  using: composite
  steps:
    - id: publish
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PAGES_ARTIFACT_ID: ${{ inputs.artifact_id }}
      with:
        retries: 0
        debug: false
        script: |
          const { pathToFileURL } = require('node:url');
          const { resolve } = require('node:path');
          const { deployPages } = await import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE, 'scripts/lib/pages-deployment.mjs')).href);
          const controller = new AbortController();
          const stop = () => controller.abort();
          process.once('SIGINT', stop);
          process.once('SIGTERM', stop);
          try {
            const result = await deployPages({
              request: (route, params) => github.request(route, params),
              getIDToken: () => core.getIDToken(),
              owner: context.repo.owner, repo: context.repo.repo,
              artifactId: process.env.PAGES_ARTIFACT_ID, buildVersion: context.sha,
              apiUrl: process.env.GITHUB_API_URL,
              signal: controller.signal, info: core.info, warning: core.warning,
            });
            core.setOutput('deployment_id', result.deploymentId);
            core.setOutput('page_url', result.pageUrl);
          } finally {
            process.removeListener('SIGINT', stop);
            process.removeListener('SIGTERM', stop);
          }
